name: Build Windows Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # Step 1 — Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Set up Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3 — Install Tesseract OCR for Windows
      - name: Install Tesseract OCR
        run: |
          choco install tesseract --yes
          echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Step 4 — Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber openpyxl pypdf pytesseract pdf2image pillow pyinstaller

      # Step 5 — Build the .exe with PyInstaller
      - name: Build executable with PyInstaller
        working-directory: exibir_NF/invoice-processor
        run: |
          pyinstaller --onefile --windowed --name "InvoiceProcessor" --add-data "src;src" --add-data "scripts;scripts" --add-data "config.json;." --hidden-import "pdfplumber" --hidden-import "openpyxl" --hidden-import "pypdf" --hidden-import "pytesseract" --hidden-import "pdf2image" --hidden-import "PIL" main.py

      # Step 6 — Upload .exe as artifact
      - name: Upload executable as artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceProcessor-Windows
          path: exibir_NF/invoice-processor/dist/InvoiceProcessor.exe
          retention-days: 30

      # Step 7 — Create GitHub Release with the .exe
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Invoice Processor v1.0.${{ github.run_number }}"
          body: |
            ## Invoice Processor — Windows Executable

            ### Download
            - **InvoiceProcessor.exe** — Windows 10/11 (64-bit)

            ### Requirements
            - Windows 10 or 11 (64-bit)
            - No Python installation needed

            ### How to use
            1. Download `InvoiceProcessor.exe`
            2. Place it in a folder of your choice
            3. Double-click to run

          files: exibir_NF/invoice-processor/dist/InvoiceProcessor.exe
          draft: false
          prerelease: false